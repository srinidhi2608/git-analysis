repositories:
  - name: "srinidhi2608/git-analysis"
    is_active: true

# Optional: team-based analysis.
# When `teams` is set, only PRs, reviews, comments and commits authored by the
# GitHub logins listed below are fetched and stored; everyone else is skipped
# and reported in the backend log after each sync. The dashboard's Team
# Overview gets a team selector. Remove the section to ingest everyone.
#
# Each member is one person; GitHub and Azure DevOps names may differ:
#
# teams:
#   GrowthTeam:
#     - name: "Vaishnavi K"                      # display name used on every page
#       github: "CF-Vaishnavi"                   # GitHub login
#       azure_devops: "vaishnavi.k@company.com"  # Azure DevOps identity (email or display name; list allowed)
#       role: developer                          # developer | tester
#     - name: "Tom QA"                           # tester without a GitHub account
#       azure_devops: "tom.q@company.com"
#       role: tester
#   IppPayFac:
#     - name: "CF-NewMember"                     # short form: name is the GitHub login

# Optional: DevOps Integration page (Azure Boards + Azure Pipelines).
# The access token goes in .env as AZURE_DEVOPS_PAT. See README "DevOps Integration".
# Link people's Azure DevOps identities to their GitHub logins with `github:` and
# `azure_devops:` on their team entries above.
#
# azure_devops:
#   organization: "your-org"              # or "https://dev.azure.com/your-org"
#   projects: ["YourProject"]
#   work_item_types: ["User Story", "Bug", "Task"]
#   deployment_pattern: "(?i)deploy|release"   # pipeline names that are deployments
#   production_pattern: "(?i)prod"             # ...and go to production (empty = all)
#   incidents:                                 # optional: work items that are incidents
#     work_item_types: ["Bug"]
#     tags: ["Incident"]

# Optional: Story Quality page (story lifecycle). The defaults below match a
# New → Active → QA Dev → QAA → INT → Released / Closed board; change them to
# your own Azure Boards state names. See docs/story-lifecycle.md.
#
# lifecycle:
#   story_types: ["User Story", "Product Backlog Item"]
#   stages:                     # in workflow order; every state belongs to one stage
#     - {name: new,      label: "New",            kind: wait,     states: ["New"]}
#     - {name: dev,      label: "Development",    kind: work,     states: ["Active"]}
#     - {name: qa,       label: "QA (lower env)", kind: work,     states: ["QA Dev In Progress"]}
#     - {name: qa_done,  label: "QA complete",    kind: wait,     states: ["QA Dev Complete"]}
#     - {name: qaa,      label: "QAA testing",    kind: work,     states: ["QAA In Progress"]}
#     - {name: qaa_done, label: "QAA complete",   kind: wait,     states: ["QAA Complete"]}
#     - {name: int,      label: "INT",            kind: work,     states: ["INT"]}
#     - {name: released, label: "Released",       kind: released, states: ["Released"]}
#     - {name: closed,   label: "Closed",         kind: closed,   states: ["Closed", "Removed"]}
#   release_tag_pattern: '(?i)^release\s*v?(\d+(?:\.\d+){0,2})$'   # "Release 2026.10.1"
#   testing:
#     enabled: false            # placeholder until test results/coverage are integrated
